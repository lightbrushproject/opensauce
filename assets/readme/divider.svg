<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 20" width="1200" height="20" role="presentation" aria-hidden="true">
<defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#06fbfc" stop-opacity="0"/><stop offset=".5" stop-color="#06fbfc"/><stop offset="1" stop-color="#06fbfc" stop-opacity="0"/></linearGradient>
<linearGradient id="base" x1="0" x2="1"><stop offset="0" stop-color="#14d7f2" stop-opacity=".4"/><stop offset="1" stop-color="#14d7f2" stop-opacity=".05"/></linearGradient>
<filter id="gl" x="-20%" y="-300%" width="140%" height="700%"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<style>
.s{animation:sweep 5.5s cubic-bezier(.33,1,.68,1) infinite}
@keyframes sweep{0%{transform:translateX(0)}85%,100%{transform:translateX(1620px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect x="0" y="9.5" width="1200" height="1" fill="url(#base)"/>
<rect class="s" x="-400" y="8.5" width="360" height="3" fill="url(#g)" filter="url(#gl)" opacity=".9"/>
<rect class="s" x="-400" y="9" width="360" height="2" fill="url(#g)"/>
<rect x="0" y="6" width="2" height="8" fill="#14d7f2"/>
</svg>